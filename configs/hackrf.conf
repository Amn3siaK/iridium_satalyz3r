# HackRF One - covers the whole Iridium band (1616-1626.5 MHz)
# Run with: SDR=hackrf ./run-ui.sh
#
# By default the scripts receive through hackrf_transfer with a manually chosen
# intermediate frequency (the [hackrf-transfer] section). With the HackRF's automatic IF (~2.42 GHz)
# 2.4 GHz Wi-Fi leaks into the IF stage and floods the burst detector (~1000 false detections/s,
# mostly junk frames). A manual IF avoids that. Tested at 2.6 GHz: false detections 57000/min -> ~170/min,
# real structured frames up ~3x. 2.25 GHz then measured ~1.7 dB better SNR than 2.6 GHz (lower receiver noise),
# with no extra false detections.
# To use the plain GNU Radio/osmosdr source instead: HACKRF_OSMOSDR=1 SDR=hackrf ./run-ui.sh

[osmosdr-source]
sample_rate=10000000
center_freq=1622000000
bandwidth=9000000
# bias=1 powers an ACTIVE antenna through the coax (~3.3 V).
# Set bias=0 for a passive antenna: some passive antennas are a DC short.
device_args='hackrf=0,bias=1'
# (osmosdr fallback only) amp off; best of the tested settings with the automatic IF
gain=0
if_gain=40
bb_gain=50

[hackrf-transfer]
# intermediate frequency in Hz (2170-2740 MHz). Keep it away from 2.4-2.48 GHz Wi-Fi,
# LTE band 1 downlink (up to 2170 MHz) and LTE band 40 (2300-2400 MHz). Lower IFs are less noisy.
if_freq=2250000000
# analog baseband filter (Hz)
bandwidth=9000000
# RF amp on/off (needed with a manual IF to make up a few dB), LNA 0-40 dB (steps of 8), VGA 0-62 dB (steps of 2)
amp=1
lna=40
vga=50
# antenna power (bias tee): 1 for an active antenna, 0 for passive
bias=1
# burst detection threshold in dB (gr-iridium default 18). 16 gave the most real frames in testing;
# lower values mostly add junk frames.
threshold=16
