# gr-iridium source: RTL-SDR (tested with RTL-SDR Blog V4)
[osmosdr-source]
# 2.5 MSps: gr-iridium needs a multiple of 250 kHz
sample_rate=2500000
# 1624.5-1627.0 MHz: the whole simplex band (ring alert 1626.27, pagers) + top of the duplex band
center_freq=1625750000
# bias=1 powers an ACTIVE antenna through the coax (~4.5 V on the V4).
# Set bias=0 for a passive antenna: some passive antennas are a DC short.
device_args='rtl=0,bias=1'
bandwidth=0
# whole numbers only; the driver rounds to its nearest gain step (50 -> 49.6 dB)
gain=50
